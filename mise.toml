[tools]
bun = "1.4.2"
fnox = "1.35.2"
hk = "2.2.0"
pkl = "0.32.1"

# Local binaries (biome, tsc, knip) for tasks, hk and the shell alike.
[env]
_.path = ["./node_modules/.bin"]

[tasks.test]
run = "bun test --coverage"

[tasks.lint]
run = "biome check --error-on-warnings ."

[tasks.typecheck]
run = "tsc --noEmit"

[tasks.unused]
run = "knip --no-progress"

[tasks.check]
depends = ["test", "lint", "typecheck", "unused"]
